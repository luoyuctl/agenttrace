name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and repo contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Lint workflows
        run: |
          # actionlint v1.7.12
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -p agenttrace-core -p agenttrace-tui -p agenttrace --all-targets -- -D warnings

      - name: Validate Cargo manifests
        run: scripts/ci/check-cargo-manifests.sh

      - name: Release surface drift
        run: scripts/ci/check-release-surfaces.sh

      - name: Validate helper scripts
        run: bash -n scripts/record-demo.sh scripts/ci/*.sh scripts/release/*.sh

      - name: Validate Homebrew formula syntax
        run: ruby -c packaging/homebrew/Formula/agenttrace.rb

      - name: Test npm package contract
        run: npm --prefix packaging/npm test

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux tests run under the coverage job.
        os: [macos-14, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Rust tests
        shell: bash
        run: cargo test --locked -p agenttrace-core -p agenttrace-tui -p agenttrace

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.89"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check
        run: cargo check --locked -p agenttrace-core -p agenttrace-tui -p agenttrace

  smoke:
    name: Release binary smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENTTRACE_BIN: target/release/agenttrace
      AGENTTRACE_CI_OUT: ci-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build CLI
        run: cargo build --locked --release -p agenttrace

      - name: Demo and report output contract
        run: scripts/ci/check-output-contract.sh

      - name: Deterministic demo output
        run: scripts/ci/check-deterministic-output.sh

      - name: Report semantic consistency
        run: scripts/ci/check-report-semantics.sh

      - name: i18n catalog and coverage
        run: scripts/ci/check-i18n.sh

      - name: Documented command smoke tests
        run: scripts/ci/check-docs-commands.sh

      - name: Rust CLI fixture smoke
        env:
          AGENTTRACE_REAL_CLI_DIR: testdata
          AGENTTRACE_REAL_CLI_QUERY: internal/ws
          AGENTTRACE_REAL_CLI_FILE_LIMIT: "20"
          AGENTTRACE_REAL_CLI_OUT: ci-artifacts/real-cli-smoke
        run: scripts/ci/check-rust-real-cli-smoke.sh

      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Rust TUI fixture smoke
        env:
          AGENTTRACE_TUI_REAL_DIR: testdata
        run: scripts/ci/check-rust-tui-real-smoke.sh

      - name: Upload demo report artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agenttrace-ci-reports
          path: ci-artifacts
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Test and coverage (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-llvm-cov

      - name: Rust tests with coverage
        run: cargo llvm-cov --locked -p agenttrace-core -p agenttrace-tui -p agenttrace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: lcov.info
          disable_search: true
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          fail_ci_if_error: false

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          arguments: --all-features

  # Single required status check for the master ruleset; keep this job name stable.
  gate:
    name: Test and build
    if: always()
    needs: [lint, test, msrv, smoke, coverage, deny]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all CI jobs to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [[ "$result" == "success" ]] || exit 1
          done
