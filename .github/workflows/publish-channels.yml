name: Publish Homebrew for a release

# Manual recovery for an already published release: re-renders the Homebrew
# Formula from that release's checksums without rebuilding binaries or
# recreating the GitHub Release and npm package. WinGet is submitted by hand
# until the package is accepted into microsoft/winget-pkgs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.9.0)
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.tag }} to Homebrew
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir dist

      - name: Render channel manifests
        run: scripts/release/render-channels.sh "${TAG#v}" dist/checksums.txt channel-dist

      - name: Publish Homebrew Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$HOMEBREW_TAP_TOKEN" || {
            echo "HOMEBREW_TAP_TOKEN is required to update luoyuctl/homebrew-tap." >&2
            exit 1
          }
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/luoyuctl/homebrew-tap.git" homebrew-tap
          install -Dm644 channel-dist/homebrew/Formula/agenttrace.rb homebrew-tap/Formula/agenttrace.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agenttrace.rb
          git diff --cached --quiet || git commit -m "agenttrace ${TAG}"
          git push origin HEAD

      - name: Upload WinGet manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agenttrace-winget-${{ inputs.tag }}
          path: channel-dist/winget
          if-no-files-found: error
