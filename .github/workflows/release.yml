name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Verify release sources
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-verify-${{ hashFiles('**/Cargo.lock') }}

      - name: Rust tests
        run: cargo test -p agenttrace-core -p agenttrace-tui -p agenttrace

  build:
    name: Build release assets
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: agenttrace-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: agenttrace-linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: agenttrace-darwin-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: agenttrace-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: agenttrace-windows-amd64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: agenttrace-windows-arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux ARM linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          AGENTTRACE_RELEASE_VERSION="$release_version" \
            cargo build --release -p agenttrace --target "${{ matrix.target }}"
          out="${{ matrix.asset }}"
          exe=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then exe=".exe"; fi
          cp "target/${{ matrix.target }}/release/agenttrace${exe}" "$out"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$out" > "${out}.sha256"
          else
            shasum -a 256 "$out" > "${out}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          cat *.sha256 > checksums.txt
          sort -o checksums.txt checksums.txt

      - name: Attest release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: dist/agenttrace-*

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Pack npm launcher
        run: |
          version="${GITHUB_REF_NAME#v}"
          RELEASE_VERSION="$version" node -e '
            const fs = require("fs");
            const file = "npm/package.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = process.env.RELEASE_VERSION;
            fs.writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`);
          '
          cd npm
          npm pack --pack-destination ../dist

      - name: Configure npm registry authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || {
            echo "NPM_TOKEN is required to publish the npm package." >&2
            exit 1
          }
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"

      - name: Publish npm launcher
        run: |
          npm publish "./dist/zack78-agenttrace-${GITHUB_REF_NAME#v}.tgz" --access public

      - name: Render Homebrew and WinGet manifests
        run: |
          scripts/release/render-channels.sh \
            "${GITHUB_REF_NAME#v}" \
            dist/checksums.txt \
            channel-dist

      - name: Publish Homebrew Formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$HOMEBREW_TAP_TOKEN" || {
            echo "HOMEBREW_TAP_TOKEN is required to update luoyuctl/homebrew-tap." >&2
            exit 1
          }
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/luoyuctl/homebrew-tap.git" homebrew-tap
          install -Dm644 channel-dist/homebrew/Formula/agenttrace.rb homebrew-tap/Formula/agenttrace.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agenttrace.rb
          git diff --cached --quiet || git commit -m "agenttrace ${GITHUB_REF_NAME}"
          git push origin HEAD

      - name: Upload WinGet manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agenttrace-winget-${{ github.ref_name }}
          path: channel-dist/winget
          if-no-files-found: error

      - name: Submit WinGet manifest
        env:
          GH_TOKEN: ${{ github.token }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          test -n "$WINGET_GITHUB_TOKEN" || {
            echo "WINGET_GITHUB_TOKEN is required to submit the WinGet manifest." >&2
            exit 1
          }
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker run --rm \
            -e WINGET_GITHUB_TOKEN \
            -v "$PWD/channel-dist/winget/manifests:/manifests:ro" \
            ghcr.io/microsoft/winget-create:latest \
            submit /manifests --token "$WINGET_GITHUB_TOKEN" --submit \
              --prtitle "New version: Luoyuctl.AgentTrace $GITHUB_REF_NAME"
