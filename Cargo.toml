[workspace]
members = [
  "crates/agenttrace-core",
  "crates/agenttrace-cli",
  "crates/agenttrace-tui",
]
resolver = "2"

[workspace.package]
version = "0.0.0-dev"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Local-first TUI and reports for AI coding-agent session history, cost, tokens, time, and slow-run diagnosis."
repository = "https://github.com/luoyuctl/agenttrace"
homepage = "https://github.com/luoyuctl/agenttrace"
readme = "README.md"
keywords = ["agent", "observability", "tui", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "serde",
] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
rusqlite = { version = "0.40", features = ["bundled"] }
rust-i18n = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2.0"
ureq = "2.12"
