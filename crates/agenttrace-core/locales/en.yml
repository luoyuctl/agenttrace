    confidence: "low: loaded-session counts and schema tokens are unavailable because these logs expose invocations, not complete MCP inventories"
    investigate_failures: "investigate failed calls before changing server scope"
    material_usage: "observed usage is material; loading coverage cannot be inferred from invocation-only logs"
    methodology: "MCP server names are inferred from tool-name prefixes. Invocation coverage is reported only among observed calls; loaded-server inventory and schema-token cost are intentionally left unmeasured."
