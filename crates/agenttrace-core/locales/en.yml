    commits_overlap: "%{count} local Git commit(s) overlap the session time window"
    confidence: "%{confidence}: time-window heuristic; Git commits are correlated, not attributable proof of main-merge or business value"
    external_publish: "observed external publish command category"
    git_write: "observed git write command category"
    methodology_git: "Read-only local Git heuristic: commit timestamps are matched to session start/end with a 2-minute lead and 5-minute tail. It does not prove authorship, merge-to-main, or business value."
