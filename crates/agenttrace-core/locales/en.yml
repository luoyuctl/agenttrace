    aggregate: "SQLite aggregated multiple model IDs; no single-model exact price applies"
    catalog: "exact normalized model match in pricing catalog"
    fallback: "no exact catalog match; built-in fallback rate used"
    multiple_models: "unavailable: multiple models"
    not_recorded: "not recorded"
    recalculated: "%{note}; current rates recalculate a different total than the stored estimate"
    unknown_model: "model name is missing or generic"
    unknown_model_session: "model name is missing or generic; cost is not a catalog match"
  rec:
    context_pressure:
      action: "Carry only the current goal, relevant files, and failing output into a fresh session."
      rationale: "Conversation and tool context leave little room for the active task."
      title: "Start a narrower follow-up session"
    retry_loop:
      action: "Stop after two unchanged failures; inspect the failure boundary before retrying."
      rationale: "%{count} repeated tool events or loop group(s) were detected."
      title: "Bound repeated tool retries"
    slow_tool:
      action: "Set a timeout and batch independent work instead of serial retries."
      rationale: "A tool exceeded the latency threshold or reported a timeout."
      title: "Bound slow tool execution"
    tool_failures:
      action: "Inspect arguments and results, then change the approach instead of retrying unchanged calls."
      rationale: "Tool failures increase wall time and often precede repeated work."
      title: "Reduce failing tool calls"
